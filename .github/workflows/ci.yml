name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew clean check --console=plain
      - name: Upload test and coverage reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/jacoco/test/

  # Publishes the version declared in build.gradle the first time it reaches master, then tags it. A
  # version that is already tagged is skipped, so merges that do not bump the version are no-ops here.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the version and check whether it is already released
        id: version
        run: |
          version=$(sed -nE "s/^version *= *'([^']+)'.*/\1/p" build.gradle)
          if [ -z "$version" ]; then echo "::error::No version found in build.gradle"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to publish."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        if: steps.version.outputs.released == 'false'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.released == 'false'
      - name: Publish to GitHub Packages
        if: steps.version.outputs.released == 'false'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish --console=plain
      - name: Tag and create the GitHub release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
